when:
  branch: master
  event: [push, manual]
steps:
  - name: build
    image: docker.test4x.com/xgfan/plugin-docker-buildx-check
    settings:
      repo: docker.test4x.com/xgfan/gallery
      registry: docker.test4x.com
      mirror: https://docker.test4x.com
      tags:
        - "${CI_COMMIT_BRANCH}-${CI_COMMIT_SHA:0:8}-${CI_PIPELINE_NUMBER}"
        - latest
      mtu: 1450
      cache_from: docker.test4x.com/xgfan/gallery:cache
      cache_to: docker.test4x.com/xgfan/gallery:cache
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password
  - name: notify-success
    image: docker.test4x.com/xgfan/plugin-bark
    failure: ignore
    settings:
      token:
        from_secret: bark_token
      status: success
  - name: notify-failure
    image: docker.test4x.com/xgfan/plugin-bark
    failure: ignore
    settings:
      token:
        from_secret: bark_token
      status: failure
    when:
      - status: [failure]
